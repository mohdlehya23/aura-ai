[project]
name = "aura-ai"
version = "2.0.0"
description = "Stealth AI Real-time Assistant"
readme = "README.md"
requires-python = ">=3.10"

[tool.pyrefly]
python-interpreter-path = "venv/Scripts/python.exe"
search-path = [
    ".",
    "venv/Lib/site-packages"
]
site-packages-path = [
    "venv/Lib/site-packages"
]

[tool.pyright]
venvPath = "."
venv = "venv"
extraPaths = [
    ".",
    "venv/Lib/site-packages"
]

